name: Setup Trivy
description: Install a pinned Trivy release after verifying its checksum

inputs:
  version:
    description: Trivy version without the leading v
    required: true

runs:
  using: composite
  steps:
    - name: Install Trivy ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/aquasecurity/trivy/releases/download/v${VERSION}"
        tarball="trivy_${VERSION}_Linux-64bit.tar.gz"
        cd "$RUNNER_TEMP"
        curl -sSfLO "${base}/${tarball}"
        curl -sSfLO "${base}/trivy_${VERSION}_checksums.txt"
        grep " ${tarball}\$" "trivy_${VERSION}_checksums.txt" | sha256sum -c -
        tar -xzf "${tarball}" trivy
        sudo install -m 0755 trivy /usr/local/bin/trivy
        trivy --version
