name: CI/CD

on:
  push:
    branches:
      - Dev
      - Test
      - Prod
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - Dev
      - Test
      - Prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24.21.0"
  HADOLINT_VERSION: "v2.12.0"
  TRIVY_VERSION: "0.75.0"
  KIND_VERSION: "v0.33.0"
  KUSTOMIZE_VERSION: "v5.8.3"
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  IMAGE_NAME: ghcr.io/favioronaldo/devsu-demo-devops-nodejs
  DEPLOY_ENV: ${{ github.ref_name == 'Prod' && 'prod' || github.ref_name == 'Test' && 'test' || 'dev' }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  security-scan:
    name: Dependency, secret & IaC scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Trivy
        uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Trivy dependencies & secrets
        run: trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

      - name: Trivy Dockerfile & Kubernetes misconfigurations
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .

      - name: Trivy SARIF report
        if: always()
        run: trivy fs --scanners vuln,secret,misconfig --format sarif --output trivy-fs.sarif .

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build-test:
    name: Build, lint & unit tests
    needs: security-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build (install dependencies)
        run: npm ci --no-audit --no-fund

      - name: Static analysis (ESLint)
        run: npm run lint

      - name: Static analysis (hadolint)
        run: docker run --rm -i "hadolint/hadolint:${HADOLINT_VERSION}" < Dockerfile

      - name: Unit tests with coverage
        run: npm run test:coverage -- --ci

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${t[k].covered}/${t[k].total} | ${t[k].pct}% |`)
            console.log(["### Code coverage", "| Metric | Covered | % |", "|---|---|---|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  sonarcloud:
    name: SonarCloud analysis
    needs: build-test
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage
          path: coverage

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0

      - name: SonarCloud not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarCloud::SONAR_TOKEN secret is not configured, analysis skipped"

  terraform-validate:
    name: Terraform validate
    needs: sonarcloud
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: TFLint
        run: docker run --rm -v "$PWD:/data" -w /data "ghcr.io/terraform-linters/tflint:${TFLINT_VERSION}" --format compact

  docker:
    name: Docker build, scan & push
    needs: terraform-validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      tag: sha-${{ steps.vars.outputs.short_sha }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Variables
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ env.DEPLOY_ENV }},enable=${{ env.PUBLISH }}
            type=raw,value=latest,enable=${{ github.ref_name == 'Prod' }}
            type=ref,event=pr

      - name: Docker build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Trivy
        uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Trivy image vulnerability scan
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE_NAME}:scan"

      - name: Trivy image SARIF report
        if: always()
        run: trivy image --format sarif --output trivy-image.sarif "${IMAGE_NAME}:scan"

      - name: Upload image SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Container smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 "${IMAGE_NAME}:scan"
          bash scripts/smoke-test.sh http://localhost:8000
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "HEALTHCHECK status: $status"
          [ "$status" = "healthy" ]
          echo "Runs as: $(docker exec smoke id)"
          docker rm -f smoke

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker push
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Image summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Kubernetes
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'Prod' && 'prod' || github.ref_name == 'Test' && 'test' || 'dev' }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.docker.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Environment settings
        run: |
          case "$DEPLOY_ENV" in
            prod) host="api.devsu-demo.local" ;;
            *) host="api.${DEPLOY_ENV}.devsu-demo.local" ;;
          esac
          echo "NAMESPACE=devsu-${DEPLOY_ENV}" >> "$GITHUB_ENV"
          echo "HOST=${host}" >> "$GITHUB_ENV"
          echo "OVERLAY=k8s/overlays/${DEPLOY_ENV}" >> "$GITHUB_ENV"

      - name: Install kind & kustomize
        run: |
          curl -sSfLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kind version && kustomize version && kubectl version --client && helm version --short

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform plan (kind cluster + platform)
        working-directory: terraform
        run: |
          terraform init -input=false -no-color | tee ../terraform-init.txt
          terraform plan -input=false -no-color -out=tfplan | tee ../terraform-plan.txt

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -input=false -no-color -auto-approve tfplan | tee ../terraform-apply.txt
          terraform output -no-color | tee ../terraform-output.txt
          kubectl get nodes -o wide
          kubectl -n traefik rollout status deployment/traefik --timeout=180s
          kubectl -n cert-manager wait certificate/devsu-demo-ca --for=condition=Ready --timeout=120s
          kubectl get clusterissuer

      - name: Upload Terraform evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: terraform-${{ env.DEPLOY_ENV }}
          path: terraform-*.txt
          retention-days: 30

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image into the cluster
        run: |
          docker pull "${IMAGE_NAME}:${IMAGE}"
          kind load docker-image "${IMAGE_NAME}:${IMAGE}" --name devsu-demo

      - name: Render manifests
        env:
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          if [ -z "$DATABASE_USER" ] || [ -z "$DATABASE_PASSWORD" ]; then
            echo "::error::DATABASE_USER and DATABASE_PASSWORD must be set as ${DEPLOY_ENV} environment secrets"
            exit 1
          fi
          umask 077
          printf 'DATABASE_USER=%s\nDATABASE_PASSWORD=%s\n' "$DATABASE_USER" "$DATABASE_PASSWORD" > "${OVERLAY}/secrets.env"
          (cd "$OVERLAY" && kustomize edit set image "demo-devops-nodejs=${IMAGE_NAME}:${IMAGE}")
          kustomize build "$OVERLAY" > manifests.yaml
          grep -E "image: " manifests.yaml | sort -u

      - name: Deploy
        run: |
          kubectl apply -f manifests.yaml
          kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/api --timeout=180s
          kubectl -n "$NAMESPACE" wait certificate/api-tls --for=condition=Ready --timeout=120s

      - name: Smoke test through the Ingress (HTTPS)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --resolve "${HOST}:80:127.0.0.1" "http://${HOST}/health")
          echo "HTTP -> HTTPS redirect: ${code}"
          [ "$code" = "301" ]
          bash scripts/smoke-test.sh "https://${HOST}" -k --resolve "${HOST}:443:127.0.0.1"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployed to \`${NAMESPACE}\` (${HOST})"
            echo "Image: \`${IMAGE_NAME}:${IMAGE}\`"
            echo '```'
            kubectl -n "$NAMESPACE" get deploy,sts,pods,svc,ingress,hpa,pdb,certificate -o wide 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/name=api --all-containers --tail=100 || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/name=postgres --tail=100 || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp
