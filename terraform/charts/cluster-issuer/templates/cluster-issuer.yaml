apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devsu-demo-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: devsu-demo-ca
  subject:
    organizations:
      - devsu-demo
  secretName: devsu-demo-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: devsu-demo-ca
spec:
  ca:
    secretName: devsu-demo-ca
